name: Deploy

# Build + push the three images to GHCR, then roll out on the Hetzner swarm
# manager over SSH (migrate one-shot -> docker stack deploy, both via
# infra/deploy.sh).
#
# Triggers: a `v*` tag push (the release cut), or manual dispatch. The App
# workflow also runs on tag pushes, so the same SHA still gets the full
# type/lint/test/migration gate — cut the tag only from a green commit.
#
# Repo/environment secrets required:
#   DEPLOY_SSH_HOST / DEPLOY_SSH_USER / DEPLOY_SSH_KEY  — SSH to the manager
#   GHCR_USERNAME / GHCR_TOKEN                          — PAT w/ read:packages,
#                                                        for the box to pull
# The appleboy ssh/scp actions are third-party conveniences — swap for raw
# ssh + ssh-keyscan if you'd rather not depend on them.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: t
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          fi

  images:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: engofy
            dockerfile: Dockerfile
            context: .
          - name: engofy-web
            dockerfile: apps/web/Dockerfile
            context: .
          - name: engofy-nlp
            dockerfile: nlp-service/Dockerfile
            context: nlp-service
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/oleksiikhr/${{ matrix.name }}:${{ needs.prepare.outputs.tag }}
            ghcr.io/oleksiikhr/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: [prepare, images]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Copy stack file + deploy script to the manager
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "infra/stack.prod.yaml,infra/deploy.sh"
          target: "/opt/engofy"
          overwrite: true

      - name: Migrate + stack deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            chmod +x /opt/engofy/infra/deploy.sh
            IMAGE_TAG="${{ needs.prepare.outputs.tag }}" /opt/engofy/infra/deploy.sh
