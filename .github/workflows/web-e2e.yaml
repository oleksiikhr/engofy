name: Web E2E

# apps/web Playwright suite (deferred backlog #6 — automate post-launch).
# It needs the whole request path up: migrated Postgres + Redis, the Nest API,
# and the Astro SSR server. Gated to manual dispatch + pushes to `main` so it
# is not on every feature push. May need a tweak on its first real run
# (frontend verification is weaker — see REVIEW.md "Batch S").

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4-alpine3.24
        ports: ['5432:5432']
        env:
          POSTGRES_USER: engofy
          POSTGRES_PASSWORD: engofy
          POSTGRES_DB: engofy
        options: >-
          --health-cmd "pg_isready -U engofy -d engofy"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.0-alpine3.23
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      NODE_ENV: development
      MIKRO_ORM_HOST: localhost
      MIKRO_ORM_PORT: '5432'
      MIKRO_ORM_USER: engofy
      MIKRO_ORM_PASSWORD: engofy
      MIKRO_ORM_DB_NAME: engofy
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      PUBLIC_URL: http://localhost:4321
      S3_BUCKET: engofy
      S3_REGION: us-east-1
      API_ORIGIN: http://localhost:8080
      WEB_BASE_URL: http://localhost:4321

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Build API + web
        run: |
          pnpm build
          pnpm --dir apps/web run build

      - name: Migrate DB
        run: pnpm migration:up

      - name: Start API + Astro server
        run: |
          set -euo pipefail
          node dist/main & echo $! > api.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/_healthz >/dev/null && break || sleep 1
          done
          curl -sf http://localhost:8080/_healthz
          ( cd apps/web && PORT=4321 HOST=127.0.0.1 node ./dist/server/entry.mjs & echo $! > ../../web.pid )
          for i in $(seq 1 60); do
            curl -sf http://localhost:4321/ >/dev/null && break || sleep 1
          done

      - name: Playwright
        run: |
          pnpm --dir apps/web exec playwright install --with-deps chromium
          pnpm --dir apps/web run test:e2e

      - name: Stop servers
        if: always()
        run: |
          kill "$(cat api.pid)" "$(cat web.pid)" 2>/dev/null || true

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
