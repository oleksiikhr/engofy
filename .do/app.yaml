# App Platform spec — see docs/deploy.md for the rationale behind each value.
# Placeholders to replace before `doctl apps create --spec .do/app.yaml`:
#   TAG            image tag being released (also used as SENTRY_RELEASE)
#   CHANGE_ME      values from the managed Postgres panel and the public domain
# SECRET vars carry no value here; enter them in the control panel.
# Var reference: .env.production.example.
name: engofy
region: fra

services:
  - name: web
    image:
      registry_type: DOCR
      repository: engofy
      tag: TAG
    run_command: node main
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /api
    health_check:
      http_path: /_healthz
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: "production"
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: "info"
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_RELEASE
        scope: RUN_TIME
        value: "TAG"
      - key: HOST
        scope: RUN_TIME
        value: "0.0.0.0"
      - key: PORT
        scope: RUN_TIME
        value: "8080"
      - key: PUBLIC_URL
        scope: RUN_TIME
        value: "https://engofy.com"
      - key: CLIENT_IP_HEADER
        scope: RUN_TIME
        value: "cf-connecting-ip"
      - key: MIKRO_ORM_HOST
        scope: RUN_TIME
        value: "CHANGE_ME"
      - key: MIKRO_ORM_PORT
        scope: RUN_TIME
        value: "25060"
      - key: MIKRO_ORM_USER
        scope: RUN_TIME
        value: "CHANGE_ME"
      - key: MIKRO_ORM_DB_NAME
        scope: RUN_TIME
        value: "CHANGE_ME"
      - key: MIKRO_ORM_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DB_SSL
        scope: RUN_TIME
        value: "true"
      - key: DB_SSL_CA
        scope: RUN_TIME
        value: "CHANGE_ME"
      - key: DB_POOL_MAX
        scope: RUN_TIME
        value: "5"
      - key: QUEUE_POOL_MAX
        scope: RUN_TIME
        value: "2"
      - key: REDIS_HOST
        scope: RUN_TIME
        value: "redis"
      - key: REDIS_PORT
        scope: RUN_TIME
        value: "6379"
      - key: NLP_SERVICE_URL
        scope: RUN_TIME
        value: "http://nlp:8000"
      - key: MAIL_FROM_EMAIL
        scope: RUN_TIME
        value: "Engofy <onboarding@engofy.com>"
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_CLIENT_ID
        scope: RUN_TIME
        value: ""
      - key: QUEUE_SHUTDOWN_TIMEOUT_MS
        scope: RUN_TIME
        value: "120000"
  - name: apps-web
    image:
      registry_type: DOCR
      repository: engofy-web
      tag: TAG
    http_port: 4321
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
    health_check:
      http_path: /
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: "production"
      - key: HOST
        scope: RUN_TIME
        value: "0.0.0.0"
      - key: PORT
        scope: RUN_TIME
        value: "4321"
      - key: API_ORIGIN
        scope: RUN_TIME
        value: "http://web:8080"
      - key: CLIENT_IP_HEADER
        scope: RUN_TIME
        value: "cf-connecting-ip"
      - key: PUBLIC_GOOGLE_CLIENT_ID
        scope: RUN_AND_BUILD_TIME
        value: ""
  - name: nlp
    image:
      registry_type: DOCR
      repository: engofy-nlp
      tag: TAG
    internal_ports:
      - 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    health_check:
      http_path: /health
      port: 8000
      initial_delay_seconds: 40
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3

  - name: redis
    image:
      registry_type: DOCKER_HUB
      registry: library
      repository: redis
      tag: 8-alpine
    run_command: redis-server --save "" --appendonly no
    internal_ports:
      - 6379
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      tcp_port: 6379
      initial_delay_seconds: 5
      period_seconds: 10
      timeout_seconds: 3
      failure_threshold: 3

workers:
  - name: worker
    image:
      registry_type: DOCR
      repository: engofy
      tag: TAG
    run_command: node worker
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb-fixed
    termination:
      grace_period_seconds: 180
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: "production"
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: "info"
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_RELEASE
        scope: RUN_TIME
        value: "TAG"
      - key: MIKRO_ORM_HOST
        scope: RUN_TIME
        value: "CHANGE_ME"
      - key: MIKRO_ORM_PORT
        scope: RUN_TIME
        value: "25060"
      - key: MIKRO_ORM_USER
        scope: RUN_TIME
        value: "CHANGE_ME"
      - key: MIKRO_ORM_DB_NAME
        scope: RUN_TIME
        value: "CHANGE_ME"
      - key: MIKRO_ORM_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DB_SSL
        scope: RUN_TIME
        value: "true"
      - key: DB_SSL_CA
        scope: RUN_TIME
        value: "CHANGE_ME"
      - key: DB_POOL_MAX
        scope: RUN_TIME
        value: "4"
      - key: QUEUE_POOL_MAX
        scope: RUN_TIME
        value: "3"
      - key: REDIS_HOST
        scope: RUN_TIME
        value: "redis"
      - key: REDIS_PORT
        scope: RUN_TIME
        value: "6379"
      - key: NLP_SERVICE_URL
        scope: RUN_TIME
        value: "http://nlp:8000"
      - key: QUEUE_SHUTDOWN_TIMEOUT_MS
        scope: RUN_TIME
        value: "120000"
      - key: AI_MODEL
        scope: RUN_TIME
        value: "claude-sonnet-5"
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MAIL_FROM_EMAIL
        scope: RUN_TIME
        value: "Engofy <onboarding@engofy.com>"
      - key: RESEND_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: PUBLIC_URL
        scope: RUN_TIME
        value: "https://engofy.com"
  - name: cron
    image:
      registry_type: DOCR
      repository: engofy
      tag: TAG
    run_command: node cron
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    termination:
      grace_period_seconds: 60
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: "production"
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: "info"
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_RELEASE
        scope: RUN_TIME
        value: "TAG"
      - key: MIKRO_ORM_HOST
        scope: RUN_TIME
        value: "CHANGE_ME"
      - key: MIKRO_ORM_PORT
        scope: RUN_TIME
        value: "25060"
      - key: MIKRO_ORM_USER
        scope: RUN_TIME
        value: "CHANGE_ME"
      - key: MIKRO_ORM_DB_NAME
        scope: RUN_TIME
        value: "CHANGE_ME"
      - key: MIKRO_ORM_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DB_SSL
        scope: RUN_TIME
        value: "true"
      - key: DB_SSL_CA
        scope: RUN_TIME
        value: "CHANGE_ME"
      - key: DB_POOL_MAX
        scope: RUN_TIME
        value: "2"
      - key: QUEUE_POOL_MAX
        scope: RUN_TIME
        value: "2"
      - key: REDIS_HOST
        scope: RUN_TIME
        value: "redis"
      - key: REDIS_PORT
        scope: RUN_TIME
        value: "6379"
      - key: PUBLIC_URL
        scope: RUN_TIME
        value: "https://engofy.com"
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TELEGRAM_ADMIN_USER_ID
        scope: RUN_TIME
        value: ""
      - key: TELEGRAM_CHANNEL_ID
        scope: RUN_TIME
        value: ""

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    image:
      registry_type: DOCR
      repository: engofy
      tag: TAG
    run_command: node cli migrate up
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: "production"
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: "info"
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_RELEASE
        scope: RUN_TIME
        value: "TAG"
      - key: MIKRO_ORM_HOST
        scope: RUN_TIME
        value: "CHANGE_ME"
      - key: MIKRO_ORM_PORT
        scope: RUN_TIME
        value: "25060"
      - key: MIKRO_ORM_USER
        scope: RUN_TIME
        value: "CHANGE_ME"
      - key: MIKRO_ORM_DB_NAME
        scope: RUN_TIME
        value: "CHANGE_ME"
      - key: MIKRO_ORM_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DB_SSL
        scope: RUN_TIME
        value: "true"
      - key: DB_SSL_CA
        scope: RUN_TIME
        value: "CHANGE_ME"
      - key: DB_POOL_MAX
        scope: RUN_TIME
        value: "1"
      - key: QUEUE_POOL_MAX
        scope: RUN_TIME
        value: "1"
      - key: REDIS_HOST
        scope: RUN_TIME
        value: "redis"
      - key: REDIS_PORT
        scope: RUN_TIME
        value: "6379"
