services:
  postgres:
    image: postgres:18.4-alpine3.24
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    environment:
      POSTGRES_USER: engofy
      POSTGRES_PASSWORD: engofy
      POSTGRES_DB: engofy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engofy -d engofy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.0-alpine3.23
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: axllent/mailpit:v1.22.3
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 5s
      retries: 10

  spotlight:
    image: ghcr.io/getsentry/spotlight:4.11.4
    ports:
      - "8969:8969"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8969'"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
