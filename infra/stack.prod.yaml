# engofy production stack — Docker Swarm (single node), all inbound via one
# Cloudflare Tunnel. Deploy:
#
#   docker stack deploy -c infra/stack.prod.yaml --with-registry-auth engofy
#
# Prerequisites (see docs/deploy.md):
#   - swarm initialised, this node is the manager
#   - the `engofy_*` secrets and the `engofy_cloudflared_config` config created
#   - infra/.env.production present (copy of infra/.env.production.example)
#   - `docker login ghcr.io` done on this node (--with-registry-auth ships it)
#
# `env_file` is read by the deploy CLI and merged into each service's
# environment; `environment:` here holds only fixed topology (service DNS
# names, ports, pool sizes). Credentials come in as Swarm secrets and are
# turned into env vars by docker-entrypoint.sh (secret file name -> UPPER_SNAKE).

x-images:
  # ${IMAGE_TAG} comes from infra/.env.production (default: latest).
  nest: &nest-image ghcr.io/oleksiikhr/engofy:${IMAGE_TAG:-latest}
  web: &web-image ghcr.io/oleksiikhr/engofy-web:${IMAGE_TAG:-latest}
  nlp: &nlp-image ghcr.io/oleksiikhr/engofy-nlp:${IMAGE_TAG:-latest}

x-nest-env: &nest-env
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "8080"
  # Sits behind exactly one proxy hop (cloudflared). 1 = trust the first
  # X-Forwarded-For entry, so throttler / OTP counters / secure-cookie / Sentry
  # see the real client IP, not the tunnel's. (src/core/helpers/trust-proxy.helper.ts)
  TRUST_PROXY: "1"
  MIKRO_ORM_HOST: postgres
  MIKRO_ORM_PORT: "5432"
  MIKRO_ORM_USER: engofy
  MIKRO_ORM_DB_NAME: engofy
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  NLP_SERVICE_URL: http://nlp:8000

x-nest-secrets: &nest-secrets
  # Secret <name on the swarm> mounted at /run/secrets/<target>; the entrypoint
  # maps <target> -> UPPER_SNAKE env var. Shared by web / worker / cron; the
  # Anthropic key is added to `worker` only (AI runs only in a pg-boss
  # processor — no HTTP path, no cron poller calls it).
  - source: engofy_db_password
    target: mikro_orm_password       # -> MIKRO_ORM_PASSWORD
  - source: engofy_resend_api_key
    target: resend_api_key           # -> RESEND_API_KEY
  - source: engofy_telegram_bot_token
    target: telegram_bot_token       # -> TELEGRAM_BOT_TOKEN
  - source: engofy_sentry_dsn
    target: sentry_dsn               # -> SENTRY_DSN

x-worker-secrets: &worker-secrets
  # `worker` = the shared set + the Anthropic key (the only entrypoint that
  # calls the AI). Sequences can't be `<<`-merged in YAML, so it is spelled out.
  - source: engofy_db_password
    target: mikro_orm_password       # -> MIKRO_ORM_PASSWORD
  - source: engofy_resend_api_key
    target: resend_api_key           # -> RESEND_API_KEY
  - source: engofy_telegram_bot_token
    target: telegram_bot_token       # -> TELEGRAM_BOT_TOKEN
  - source: engofy_sentry_dsn
    target: sentry_dsn               # -> SENTRY_DSN
  - source: engofy_anthropic_api_key
    target: anthropic_api_key        # -> ANTHROPIC_API_KEY

x-deploy-stateless: &deploy-stateless
  update_config:
    order: start-first
    parallelism: 1
    delay: 10s
    failure_action: rollback
  rollback_config:
    order: start-first
    parallelism: 1
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 0
    window: 30s

networks:
  engofy:
    driver: overlay
    driver_opts:
      encrypted: "true"

volumes:
  pgdata:
    driver: local

secrets:
  engofy_db_password:
    external: true
  engofy_anthropic_api_key:
    external: true
  engofy_resend_api_key:
    external: true
  engofy_telegram_bot_token:
    external: true
  engofy_sentry_dsn:
    external: true
  # JSON from `cloudflared tunnel create` (see docs/deploy.md).
  engofy_cloudflared_credentials:
    external: true

configs:
  engofy_cloudflared_config:
    external: true

services:
  # --------------------------------------------------------------------------
  # Nest HTTP API — reached only through cloudflared (/api/* ) and by apps-web
  # (SSR) over the overlay. Not published to the host.
  # --------------------------------------------------------------------------
  web:
    image: *nest-image
    command: ["node", "main"]
    env_file: [./.env.production]
    environment:
      <<: *nest-env
      SENTRY_TRACES_SAMPLE_RATE_WEB: "0.1"
    secrets: *nest-secrets
    networks: [engofy]
    healthcheck:
      # /_healthz is the LIVENESS probe — process up, no dependency checks — so
      # a Postgres/Redis blip does not make Swarm kill a serving task.
      # Readiness (DB + Redis) is /_healthz/ready, for manual / LB use.
      # busybox wget ships in the node:alpine image.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/_healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    deploy:
      <<: *deploy-stateless
      replicas: 2
      resources:
        limits: { cpus: "0.75", memory: 768M }
        reservations: { cpus: "0.10", memory: 192M }
      placement:
        constraints: [node.role == manager]

  # --------------------------------------------------------------------------
  # pg-boss worker host — runs every queue (no argv = all). Streams the AI
  # calls (~2 min); give it a long stop grace so an in-flight paid stage
  # finishes instead of being retried.
  # --------------------------------------------------------------------------
  worker:
    image: *nest-image
    command: ["node", "worker"]
    env_file: [./.env.production]
    environment:
      <<: *nest-env
      SENTRY_TRACES_SAMPLE_RATE_WORKER: "0.1"
    secrets: *worker-secrets
    networks: [engofy]
    stop_grace_period: 120s
    deploy:
      <<: *deploy-stateless
      replicas: 1
      resources:
        limits: { cpus: "1.5", memory: 1024M }
        reservations: { cpus: "0.10", memory: 192M }
      placement:
        constraints: [node.role == manager]

  # --------------------------------------------------------------------------
  # @nestjs/schedule pollers — Telegram getUpdates + publish + prune.
  # EXACTLY ONE replica: the pagers only guard overlap in-process, so two
  # replicas = double getUpdates + double publish. stop-first keeps it at 1
  # across an update (never 2 briefly).
  # --------------------------------------------------------------------------
  cron:
    image: *nest-image
    command: ["node", "cron"]
    env_file: [./.env.production]
    environment:
      <<: *nest-env
      SENTRY_TRACES_SAMPLE_RATE_CRON: "0.1"
    secrets: *nest-secrets
    networks: [engofy]
    stop_grace_period: 60s
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        parallelism: 1
        delay: 5s
        failure_action: rollback
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        window: 60s
      resources:
        limits: { cpus: "0.25", memory: 256M }
        reservations: { cpus: "0.05", memory: 64M }
      placement:
        constraints: [node.role == manager]

  # --------------------------------------------------------------------------
  # spaCy service — internal only, never published. Image carries its own
  # HEALTHCHECK (nlp-service/Dockerfile).
  # --------------------------------------------------------------------------
  nlp:
    image: *nlp-image
    networks: [engofy]
    stop_grace_period: 15s
    deploy:
      <<: *deploy-stateless
      replicas: 1
      resources:
        limits: { cpus: "1.0", memory: 1024M }
        reservations: { cpus: "0.10", memory: 320M }
      placement:
        constraints: [node.role == manager]

  # --------------------------------------------------------------------------
  # Astro SSR frontend — the origin cloudflared sends everything that is not
  # /api/* to. Calls the Nest API over the overlay at http://web:8080.
  # --------------------------------------------------------------------------
  apps-web:
    image: *web-image
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4321"
      # api.ts prepends /api; this is the bare Nest origin.
      API_ORIGIN: http://web:8080
    env_file: [./.env.production]
    networks: [engofy]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4321/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    deploy:
      <<: *deploy-stateless
      replicas: 2
      resources:
        limits: { cpus: "0.5", memory: 512M }
        reservations: { cpus: "0.05", memory: 128M }
      placement:
        constraints: [node.role == manager]

  # --------------------------------------------------------------------------
  # Cloudflare Tunnel — the ONLY inbound path. Hetzner firewall denies all
  # inbound; no port is published anywhere in this stack. 2 replicas so a
  # restart never drops the edge. Ingress rules live in the mounted config
  # (infra/cloudflared/config.yml -> `engofy_cloudflared_config`).
  # --------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    networks: [engofy]
    configs:
      - source: engofy_cloudflared_config
        target: /etc/cloudflared/config.yml
    secrets:
      - source: engofy_cloudflared_credentials
        target: /etc/cloudflared/credentials.json
    deploy:
      <<: *deploy-stateless
      replicas: 2
      resources:
        limits: { cpus: "0.25", memory: 128M }
        reservations: { cpus: "0.02", memory: 32M }
      placement:
        constraints: [node.role == manager]

  # --------------------------------------------------------------------------
  # Postgres — app DB + pg-boss in the same instance. Single replica, pinned
  # by the bind of the named volume. Backups: infra/pg-backup.sh cron -> R2
  # (see docs/deploy.md).
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:18.4-alpine3.24
    command:
      - "postgres"
      - "-c"
      - "max_connections=150"
    environment:
      POSTGRES_USER: engofy
      POSTGRES_DB: engofy
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # LuxonTimestampType writes offset-less literals; the driver also forces
      # -c timezone=UTC per connection, this keeps the server default aligned.
      TZ: UTC
      PGTZ: UTC
    secrets:
      - source: engofy_db_password
        target: db_password
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    networks: [engofy]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engofy -d engofy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        window: 120s
      resources:
        limits: { cpus: "1.0", memory: 2048M }
        reservations: { cpus: "0.10", memory: 512M }
      placement:
        constraints: [node.role == manager]

  # --------------------------------------------------------------------------
  # Redis — ephemeral only (throttler window + otp:ip counters). No
  # persistence: a restart just resets the rate-limit windows.
  # --------------------------------------------------------------------------
  redis:
    image: redis:8.10.0-alpine3.23
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "192mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    networks: [engofy]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 10s
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s
        window: 60s
      resources:
        limits: { cpus: "0.25", memory: 256M }
        reservations: { cpus: "0.02", memory: 32M }
      placement:
        constraints: [node.role == manager]
