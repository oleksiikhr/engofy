packages:
  - apps/*

engineStrict: true

minimumReleaseAge: 10080 # 7 days

# The Astro toolchain (core, language-server / `astro check`, Shiki, Vite
# helpers) publishes far more often than the 7-day gate allows; pinning every
# churny transitive is not practical, so the frontend build/check ecosystem is
# exempted. The Nest runtime deps stay fully gated.
minimumReleaseAgeExclude:
  - astro
  - "@astrojs/*"
  - "@img/*"
  - sharp
  - shiki
  - "@shikijs/*"
  - "@types/node"
  - "@ungap/structured-clone"
  - devalue
  - magic-string
  - svgo
  - "vscode-*"
  - "@volar/*"
  - volar-service-*
  - "@vscode/*"

pmOnFail: error

overrides:
  # @nestjs/platform-fastify 11 pins fastify 5.10.0; this override deliberately
  # runs ahead of it for the security fixes in >=5.12.1 (schema-validation bypass,
  # trustProxy spoofing). Drop it once a Nest 11.x patch requires fastify >=5.12.1.
  # Verify with: pnpm why fastify
  fastify: 5.12.4
  # Transitive security floors; each is one range per major that is in use.
  find-my-way: '>=9.7.0'
  'fast-uri@3': '>=3.1.6 <4'
  'fast-uri@4': '>=4.1.3 <5'
  'js-yaml@4': '>=4.3.2 <5'
  'js-yaml@5': '>=5.2.2 <6'

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
